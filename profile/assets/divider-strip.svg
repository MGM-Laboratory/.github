<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 80" width="1280" height="80" role="img" aria-label="Pattern divider">
  <!--
    16 tiles, 80px wide, walking through shapes 1..12 (no two adjacent share a
    color OR a shape). Each tile scales in with stagger, then pulses gently.
  -->
  <defs>
    <g id="d-blue-petal"><rect width="80" height="80" fill="#3A6DC5"/>
      <path d="M0 0H2C23.7 0 41.6 17.9 41.6 40V41.6H40C17.9 41.6 0 23.7 0 1.6V0Z" fill="#fff"/>
      <path d="M0 80H2C23.7 80 41.6 62.1 41.6 40V38.4H40C17.9 38.4 0 56.3 0 78.4V80Z" fill="#fff"/>
      <path d="M80 0H78C56.3 0 38.4 17.9 38.4 40V41.6H40C62.1 41.6 80 23.7 80 1.6V0Z" fill="#fff"/>
      <path d="M80 80H78C56.3 80 38.4 62.1 38.4 40V38.4H40C62.1 38.4 80 56.3 80 78.4V80Z" fill="#fff"/>
    </g>
    <g id="d-yellow-dot"><rect width="80" height="80" fill="#F7BF33"/><circle cx="40" cy="40" r="22" fill="#fff"/></g>
    <g id="d-red-x"><rect width="80" height="80" fill="#F94141"/><path d="M22 22 L58 58 M58 22 L22 58" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>
    <g id="d-green-plus"><rect width="80" height="80" fill="#0F8657"/><path d="M40 18 V62 M18 40 H62" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>
    <g id="d-blue-tri"><rect width="80" height="80" fill="#3A6DC5"/><path d="M40 18 L62 60 L18 60 Z" fill="#fff"/></g>
    <g id="d-yellow-half"><rect width="80" height="80" fill="#F7BF33"/><path d="M40 18 A22 22 0 0 1 40 62 Z" fill="#fff"/></g>
    <g id="d-red-diamond"><rect width="80" height="80" fill="#F94141"/><path d="M40 18 L62 40 L40 62 L18 40 Z" fill="#fff"/></g>
    <g id="d-green-leaf"><rect width="80" height="80" fill="#0F8657"/><path d="M22 58 Q22 22 58 22 Q58 58 22 58 Z" fill="#fff"/></g>
    <g id="d-blue-ring"><rect width="80" height="80" fill="#3A6DC5"/><circle cx="40" cy="40" r="22" fill="none" stroke="#fff" stroke-width="6"/></g>
    <g id="d-yellow-stripes"><rect width="80" height="80" fill="#F7BF33"/><path d="M40 0 V80 M80 40 H0" stroke="#fff" stroke-width="14"/></g>
    <g id="d-red-grid"><rect width="80" height="80" fill="#F94141"/><circle cx="22" cy="22" r="6" fill="#fff"/><circle cx="58" cy="22" r="6" fill="#fff"/><circle cx="22" cy="58" r="6" fill="#fff"/><circle cx="58" cy="58" r="6" fill="#fff"/></g>
    <g id="d-green-arc"><rect width="80" height="80" fill="#0F8657"/><path d="M18 62 A36 36 0 0 1 62 18" fill="none" stroke="#fff" stroke-width="8"/></g>
  </defs>

  <rect width="1280" height="80" fill="#ffffff"/>

  <!-- Walk: blue-petal, yellow-dot, red-x, green-plus, blue-tri, yellow-half, red-diamond, green-leaf, blue-ring, yellow-stripes, red-grid, green-arc, blue-petal*, yellow-dot*, red-x*, green-plus* -->
  <g><use href="#d-blue-petal"     x="0"    y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.00s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-yellow-dot"     x="80"   y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.05s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-red-x"          x="160"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.10s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-green-plus"     x="240"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.15s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-blue-tri"       x="320"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.20s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-yellow-half"    x="400"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.25s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-red-diamond"    x="480"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.30s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-green-leaf"     x="560"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.35s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-blue-ring"      x="640"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.40s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-yellow-stripes" x="720"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.45s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-red-grid"       x="800"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.50s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-green-arc"      x="880"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.55s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-blue-petal"     x="960"  y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.60s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-yellow-dot"     x="1040" y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.65s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-red-x"          x="1120" y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.70s" fill="freeze" additive="sum"/></g>
  <g><use href="#d-green-plus"     x="1200" y="0"/><animateTransform attributeName="transform" type="scale" values="0 0; 1 1" dur="0.5s" begin="0.75s" fill="freeze" additive="sum"/></g>
</svg>
