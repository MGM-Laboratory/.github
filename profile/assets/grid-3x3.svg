<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 264" width="264" height="264" role="img" aria-label="MGM 3 by 3 pattern mosaic">
  <!--
    9 tiles, all unique shapes & no adjacent colors clash.
    Layout (color / shape):
      row1: blue-petal    | yellow-dot     | red-x
      row2: green-plus    | red-diamond    | blue-tri
      row3: yellow-half   | green-leaf     | blue-ring
    Adjacency check: every horizontal and vertical pair differs in color.
  -->
  <defs>
    <g id="g-blue-petal"><rect width="80" height="80" fill="#3A6DC5"/>
      <path d="M0 0H2C23.7 0 41.6 17.9 41.6 40V41.6H40C17.9 41.6 0 23.7 0 1.6V0Z" fill="#fff"/>
      <path d="M0 80H2C23.7 80 41.6 62.1 41.6 40V38.4H40C17.9 38.4 0 56.3 0 78.4V80Z" fill="#fff"/>
      <path d="M80 0H78C56.3 0 38.4 17.9 38.4 40V41.6H40C62.1 41.6 80 23.7 80 1.6V0Z" fill="#fff"/>
      <path d="M80 80H78C56.3 80 38.4 62.1 38.4 40V38.4H40C62.1 38.4 80 56.3 80 78.4V80Z" fill="#fff"/>
    </g>
    <g id="g-yellow-dot"><rect width="80" height="80" fill="#F7BF33"/><circle cx="40" cy="40" r="22" fill="#fff"/></g>
    <g id="g-red-x"><rect width="80" height="80" fill="#F94141"/><path d="M22 22 L58 58 M58 22 L22 58" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>
    <g id="g-green-plus"><rect width="80" height="80" fill="#0F8657"/><path d="M40 18 V62 M18 40 H62" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>
    <g id="g-blue-tri"><rect width="80" height="80" fill="#3A6DC5"/><path d="M40 18 L62 60 L18 60 Z" fill="#fff"/></g>
    <g id="g-yellow-half"><rect width="80" height="80" fill="#F7BF33"/><path d="M40 18 A22 22 0 0 1 40 62 Z" fill="#fff"/></g>
    <g id="g-red-diamond"><rect width="80" height="80" fill="#F94141"/><path d="M40 18 L62 40 L40 62 L18 40 Z" fill="#fff"/></g>
    <g id="g-green-leaf"><rect width="80" height="80" fill="#0F8657"/><path d="M22 58 Q22 22 58 22 Q58 58 22 58 Z" fill="#fff"/></g>
    <g id="g-blue-ring"><rect width="80" height="80" fill="#3A6DC5"/><circle cx="40" cy="40" r="22" fill="none" stroke="#fff" stroke-width="6"/></g>
  </defs>

  <rect width="264" height="264" fill="#ffffff"/>

  <!-- Cards float in diagonally (top-left → bottom-right stagger) -->
  <g><use href="#g-blue-petal"  x="2"   y="2"/>  <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.00s" fill="freeze"/></g>
  <g><use href="#g-yellow-dot"  x="92"  y="2"/>  <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.10s" fill="freeze"/></g>
  <g><use href="#g-red-x"       x="182" y="2"/>  <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.20s" fill="freeze"/></g>
  <g><use href="#g-green-plus"  x="2"   y="92"/> <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.30s" fill="freeze"/></g>
  <g><use href="#g-red-diamond" x="92"  y="92"/> <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.40s" fill="freeze"/></g>
  <g><use href="#g-blue-tri"    x="182" y="92"/> <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.50s" fill="freeze"/></g>
  <g><use href="#g-yellow-half" x="2"   y="182"/><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.60s" fill="freeze"/></g>
  <g><use href="#g-green-leaf"  x="92"  y="182"/><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.70s" fill="freeze"/></g>
  <g><use href="#g-blue-ring"   x="182" y="182"/><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.80s" fill="freeze"/></g>

  <!-- Subtle continuous rotation on the centre tile -->
  <g transform="translate(132 132)">
    <g transform="translate(-40 -40)">
      <rect width="80" height="80" fill="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="60s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>
</svg>
