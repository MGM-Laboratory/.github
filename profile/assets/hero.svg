<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="MGM Laboratory — Media, Game, Mobile">
  <defs>
    <linearGradient id="grad-fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="grad-left" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-right" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="hero-clip"><rect x="0" y="0" width="1280" height="420" rx="20"/></clipPath>

    <!-- A handful of pattern tiles, drawn inline so the banner is self-contained. -->

    <!-- 1: blue four-petal quarter-circles -->
    <g id="t-blue-petal">
      <rect width="80" height="80" fill="#3A6DC5"/>
      <path d="M0 0H2C23.7 0 41.6 17.9 41.6 40V41.6H40C17.9 41.6 0 23.7 0 1.6V0Z" fill="#fff"/>
      <path d="M0 80H2C23.7 80 41.6 62.1 41.6 40V38.4H40C17.9 38.4 0 56.3 0 78.4V80Z" fill="#fff"/>
      <path d="M80 0H78C56.3 0 38.4 17.9 38.4 40V41.6H40C62.1 41.6 80 23.7 80 1.6V0Z" fill="#fff"/>
      <path d="M80 80H78C56.3 80 38.4 62.1 38.4 40V38.4H40C62.1 38.4 80 56.3 80 78.4V80Z" fill="#fff"/>
    </g>

    <!-- 2: yellow circle -->
    <g id="t-yellow-dot">
      <rect width="80" height="80" fill="#F7BF33"/>
      <circle cx="40" cy="40" r="22" fill="#fff"/>
    </g>

    <!-- 3: red X -->
    <g id="t-red-x">
      <rect width="80" height="80" fill="#F94141"/>
      <path d="M22 22 L58 58 M58 22 L22 58" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 4: green plus -->
    <g id="t-green-plus">
      <rect width="80" height="80" fill="#0F8657"/>
      <path d="M40 18 V62 M18 40 H62" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 5: blue triangle -->
    <g id="t-blue-tri">
      <rect width="80" height="80" fill="#3A6DC5"/>
      <path d="M40 18 L62 60 L18 60 Z" fill="#fff"/>
    </g>

    <!-- 6: yellow half-moon -->
    <g id="t-yellow-half">
      <rect width="80" height="80" fill="#F7BF33"/>
      <path d="M40 18 A22 22 0 0 1 40 62 Z" fill="#fff"/>
    </g>

    <!-- 7: red diamond -->
    <g id="t-red-diamond">
      <rect width="80" height="80" fill="#F94141"/>
      <path d="M40 18 L62 40 L40 62 L18 40 Z" fill="#fff"/>
    </g>

    <!-- 8: green leaf -->
    <g id="t-green-leaf">
      <rect width="80" height="80" fill="#0F8657"/>
      <path d="M22 58 Q22 22 58 22 Q58 58 22 58 Z" fill="#fff"/>
    </g>

    <!-- 9: blue rings -->
    <g id="t-blue-ring">
      <rect width="80" height="80" fill="#3A6DC5"/>
      <circle cx="40" cy="40" r="22" fill="none" stroke="#fff" stroke-width="6"/>
    </g>

    <!-- 10: yellow stripes -->
    <g id="t-yellow-stripes">
      <rect width="80" height="80" fill="#F7BF33"/>
      <path d="M40 0 V80 M80 40 H0" stroke="#fff" stroke-width="14"/>
    </g>

    <!-- 11: red dot grid -->
    <g id="t-red-grid">
      <rect width="80" height="80" fill="#F94141"/>
      <circle cx="22" cy="22" r="6" fill="#fff"/>
      <circle cx="58" cy="22" r="6" fill="#fff"/>
      <circle cx="22" cy="58" r="6" fill="#fff"/>
      <circle cx="58" cy="58" r="6" fill="#fff"/>
    </g>

    <!-- 12: green arc -->
    <g id="t-green-arc">
      <rect width="80" height="80" fill="#0F8657"/>
      <path d="M18 62 A36 36 0 0 1 62 18" fill="none" stroke="#fff" stroke-width="8"/>
    </g>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="1280" height="420" fill="#ffffff"/>

  <!-- ===== Drifting pattern field — staggered fade-in then breathe ===== -->
  <g opacity="0.18" clip-path="url(#hero-clip)">
    <!-- Row 1 -->
    <g transform="translate(40 30)">
      <use href="#t-blue-petal"/>
      <animateTransform attributeName="transform" type="translate" values="40 30; 40 26; 40 30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.35;1" dur="2.4s" fill="freeze"/>
    </g>
    <g transform="translate(160 60)">
      <use href="#t-yellow-dot"/>
      <animateTransform attributeName="transform" type="translate" values="160 60; 160 64; 160 60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="0.1s" fill="freeze"/>
    </g>
    <g transform="translate(280 20)">
      <use href="#t-red-x"/>
      <animateTransform attributeName="transform" type="translate" values="280 20; 280 24; 280 20" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2s" begin="0.2s" fill="freeze"/>
    </g>
    <g transform="translate(400 50)">
      <use href="#t-green-plus"/>
      <animateTransform attributeName="transform" type="translate" values="400 50; 400 46; 400 50" dur="6.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="0.3s" fill="freeze"/>
    </g>
    <g transform="translate(900 30)">
      <use href="#t-blue-tri"/>
      <animateTransform attributeName="transform" type="translate" values="900 30; 900 34; 900 30" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.4s" begin="0.4s" fill="freeze"/>
    </g>
    <g transform="translate(1020 50)">
      <use href="#t-yellow-half"/>
      <animateTransform attributeName="transform" type="translate" values="1020 50; 1020 46; 1020 50" dur="6.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="0.5s" fill="freeze"/>
    </g>
    <g transform="translate(1140 20)">
      <use href="#t-red-diamond"/>
      <animateTransform attributeName="transform" type="translate" values="1140 20; 1140 26; 1140 20" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="0.6s" fill="freeze"/>
    </g>

    <!-- Row 2 (bottom) -->
    <g transform="translate(40 310)">
      <use href="#t-green-leaf"/>
      <animateTransform attributeName="transform" type="translate" values="40 310; 40 314; 40 310" dur="6.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="0.7s" fill="freeze"/>
    </g>
    <g transform="translate(160 290)">
      <use href="#t-blue-ring"/>
      <animateTransform attributeName="transform" type="translate" values="160 290; 160 286; 160 290" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="0.8s" fill="freeze"/>
    </g>
    <g transform="translate(280 320)">
      <use href="#t-yellow-stripes"/>
      <animateTransform attributeName="transform" type="translate" values="280 320; 280 316; 280 320" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="0.9s" fill="freeze"/>
    </g>
    <g transform="translate(900 320)">
      <use href="#t-red-grid"/>
      <animateTransform attributeName="transform" type="translate" values="900 320; 900 316; 900 320" dur="6.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="1s" fill="freeze"/>
    </g>
    <g transform="translate(1020 300)">
      <use href="#t-green-arc"/>
      <animateTransform attributeName="transform" type="translate" values="1020 300; 1020 304; 1020 300" dur="6.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="1.1s" fill="freeze"/>
    </g>
    <g transform="translate(1140 330)">
      <use href="#t-blue-petal"/>
      <animateTransform attributeName="transform" type="translate" values="1140 330; 1140 326; 1140 330" dur="6.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0" to="1" dur="2.2s" begin="1.2s" fill="freeze"/>
    </g>
  </g>

  <!-- Soft fade on the edges so the pattern bleeds rather than crops -->
  <rect x="0" y="0" width="120" height="420" fill="url(#grad-left)" pointer-events="none"/>
  <rect x="1160" y="0" width="120" height="420" fill="url(#grad-right)" pointer-events="none"/>

  <!-- ===== Center stage ===== -->
  <g transform="translate(640 210)" text-anchor="middle" font-family="'Bricolage Grotesque', 'Geist', ui-sans-serif, system-ui, sans-serif">
    <!-- Eyebrow -->
    <text x="0" y="-105" font-size="14" font-weight="600" letter-spacing="6" fill="#6b7280">
      MGM · LABORATORY
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- Wordmark — M G M with each letter in a brand color, scale-in stagger -->
    <g font-size="120" font-weight="700" letter-spacing="-4">
      <text x="-180" y="0" fill="#3A6DC5" opacity="0">
        M
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.6s" begin="0.3s" fill="freeze"/>
      </text>
      <text x="0" y="0" fill="#F7BF33" opacity="0">
        G
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.6s" begin="0.45s" fill="freeze"/>
      </text>
      <text x="180" y="0" fill="#F94141" opacity="0">
        M
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.6s" begin="0.6s" fill="freeze"/>
      </text>
    </g>

    <!-- Subtitle — Media · Game · Mobile -->
    <g transform="translate(0 56)" font-size="22" font-weight="500" fill="#0e1116" letter-spacing="0.5" opacity="0">
      <text x="-160" y="0">Media</text>
      <text x="-12" y="0" fill="#9aa1ad">·</text>
      <text x="0" y="0">Game</text>
      <text x="92" y="0" fill="#9aa1ad">·</text>
      <text x="160" y="0">Mobile</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.95s" fill="freeze"/>
    </g>

    <!-- Underline accent -->
    <g transform="translate(-100 80)" opacity="0">
      <rect x="0" y="0" width="200" height="3" fill="#0e1116" rx="1.5"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 80; -100 80" dur="0.6s" begin="1.1s" fill="freeze"/>
    </g>
  </g>

  <!-- ===== Bottom marquee strip ===== -->
  <g transform="translate(0 380)">
    <rect x="0" y="0" width="1280" height="40" fill="#0e1116"/>
    <g font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#ffffff" letter-spacing="3">
      <g>
        <text x="40" y="25">RESEARCH</text>
        <text x="200" y="25" fill="#F7BF33">●</text>
        <text x="240" y="25">WEB</text>
        <text x="320" y="25" fill="#F94141">●</text>
        <text x="360" y="25">MOBILE</text>
        <text x="460" y="25" fill="#0F8657">●</text>
        <text x="500" y="25">XR / VR / AR</text>
        <text x="640" y="25" fill="#3A6DC5">●</text>
        <text x="680" y="25">GAME</text>
        <text x="760" y="25" fill="#F7BF33">●</text>
        <text x="800" y="25">UX / HCI</text>
        <text x="920" y="25" fill="#F94141">●</text>
        <text x="960" y="25">INTERACTIVE MEDIA</text>
        <text x="1200" y="25" fill="#0F8657">●</text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1280 0" dur="22s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(1280 0)">
        <text x="40" y="25">RESEARCH</text>
        <text x="200" y="25" fill="#F7BF33">●</text>
        <text x="240" y="25">WEB</text>
        <text x="320" y="25" fill="#F94141">●</text>
        <text x="360" y="25">MOBILE</text>
        <text x="460" y="25" fill="#0F8657">●</text>
        <text x="500" y="25">XR / VR / AR</text>
        <text x="640" y="25" fill="#3A6DC5">●</text>
        <text x="680" y="25">GAME</text>
        <text x="760" y="25" fill="#F7BF33">●</text>
        <text x="800" y="25">UX / HCI</text>
        <text x="920" y="25" fill="#F94141">●</text>
        <text x="960" y="25">INTERACTIVE MEDIA</text>
        <text x="1200" y="25" fill="#0F8657">●</text>
        <animateTransform attributeName="transform" type="translate" from="1280 0" to="0 0" dur="22s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
