<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 160" width="1280" height="160" role="img" aria-label="MGM Laboratory footer">
  <defs>
    <linearGradient id="f-fade-l" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0e1116" stop-opacity="1"/>
      <stop offset="1" stop-color="#0e1116" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-fade-r" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0e1116" stop-opacity="0"/>
      <stop offset="1" stop-color="#0e1116" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="160" fill="#0e1116"/>

  <!-- Brand dots scattered & breathing -->
  <g>
    <circle cx="120"  cy="40"  r="6" fill="#3A6DC5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="220"  cy="120" r="4" fill="#F7BF33"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="340"  cy="60"  r="5" fill="#F94141"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="980"  cy="100" r="5" fill="#0F8657"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="40"  r="4" fill="#3A6DC5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="120" r="6" fill="#F7BF33"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Centre stack -->
  <g transform="translate(640 50)" text-anchor="middle" font-family="'Bricolage Grotesque','Geist',ui-sans-serif,system-ui,sans-serif" fill="#ffffff">
    <text x="0" y="0" font-size="14" letter-spacing="6" font-weight="600" fill="#9aa1ad">PROUDLY BUILT BY</text>
    <text x="0" y="42" font-size="36" font-weight="700" letter-spacing="-1">
      <tspan fill="#3A6DC5">M</tspan><tspan fill="#F7BF33">G</tspan><tspan fill="#F94141">M</tspan>
      <tspan fill="#ffffff" dx="8">Laboratory</tspan>
    </text>
    <text x="0" y="78" font-size="13" font-weight="400" letter-spacing="0.5" fill="#9aa1ad">
      Media · Game · Mobile  ·  Research Lab
    </text>
  </g>

  <!-- Reverse marquee -->
  <g transform="translate(0 134)">
    <g font-family="'Geist Mono',ui-monospace,monospace" font-size="10" font-weight="500" fill="#6b7280" letter-spacing="3">
      <g>
        <text x="40"   y="0">MGM-LABORATORY</text>
        <text x="220"  y="0">·</text>
        <text x="240"  y="0">SHIPPING SOFTWARE WITH CRAFT</text>
        <text x="540"  y="0">·</text>
        <text x="560"  y="0">RESEARCH × PRACTICE</text>
        <text x="780"  y="0">·</text>
        <text x="800"  y="0">2025</text>
        <text x="860"  y="0">·</text>
        <text x="880"  y="0">MEDIA / GAME / MOBILE</text>
        <text x="1120" y="0">·</text>
        <text x="1140" y="0">SAY HELLO</text>
        <animateTransform attributeName="transform" type="translate" from="-1280 0" to="0 0" dur="28s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-1280 0)">
        <text x="40"   y="0">MGM-LABORATORY</text>
        <text x="220"  y="0">·</text>
        <text x="240"  y="0">SHIPPING SOFTWARE WITH CRAFT</text>
        <text x="540"  y="0">·</text>
        <text x="560"  y="0">RESEARCH × PRACTICE</text>
        <text x="780"  y="0">·</text>
        <text x="800"  y="0">2025</text>
        <text x="860"  y="0">·</text>
        <text x="880"  y="0">MEDIA / GAME / MOBILE</text>
        <text x="1120" y="0">·</text>
        <text x="1140" y="0">SAY HELLO</text>
        <animateTransform attributeName="transform" type="translate" from="-2560 0" to="-1280 0" dur="28s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
