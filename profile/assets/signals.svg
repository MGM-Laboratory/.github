<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="MGM Laboratory — focus area signals">
  <defs>
    <style>
      .label   { font-family:'Bricolage Grotesque','Geist',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:16px; fill:#0E1116; }
      .num     { font-family:'Bricolage Grotesque','Geist',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:34px; letter-spacing:-1px; }
      .sub     { font-family:'Geist Mono',ui-monospace,monospace; font-size:11px; letter-spacing:2px; font-weight:500; fill:#6b7280; }
      .ink     { fill:#0E1116; }
      .muted   { fill:#6b7280; }
      .axis    { stroke:#ececea; stroke-width:1; }
      .track   { fill:#f7f7f5; }
      .legend  { font-family:'Geist Mono',ui-monospace,monospace; font-size:10px; letter-spacing:1.5px; font-weight:500; fill:#6b7280; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="#ffffff"/>

  <!-- Eyebrow -->
  <text class="sub" x="40" y="44">LAB SIGNALS · DISCIPLINE-LEVEL DISTRIBUTION</text>
  <text class="label" x="40" y="72" font-size="22">Where the work happens</text>

  <!-- Discipline bars: each is a labelled track with a growing brand-colored fill. -->
  <!-- Bars live in the right column. Left column is the legend/year. -->

  <!-- ===== Hero stat (left) ===== -->
  <g transform="translate(40 110)">
    <text class="sub" x="0" y="0">EST.</text>
    <text class="num ink" x="0" y="50" font-size="96" letter-spacing="-3">
      2025
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.7s" begin="0.1s" fill="freeze"/>
    </text>
    <rect x="0" y="68" width="0" height="3" fill="#0E1116" rx="1.5">
      <animate attributeName="width" from="0" to="220" dur="0.8s" begin="0.4s" fill="freeze"/>
    </rect>
    <text class="sub" x="0" y="110">MEDIA · GAME · MOBILE</text>
    <text class="sub" x="0" y="130">RESEARCH LAB</text>
  </g>

  <!-- ===== Bars (right) ===== -->
  <g transform="translate(400 100)">

    <!-- Web — Blue -->
    <g transform="translate(0 0)">
      <text class="legend" x="0" y="0">01 / WEB ENGINEERING</text>
      <text class="num ink" x="780" y="6" text-anchor="end" font-size="22">
        38%
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
      </text>
      <rect class="track" x="0" y="14" width="780" height="14" rx="7"/>
      <rect x="0" y="14" width="0" height="14" rx="7" fill="#3A6DC5">
        <animate attributeName="width" from="0" to="296" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Mobile — Yellow -->
    <g transform="translate(0 48)">
      <text class="legend" x="0" y="0">02 / MOBILE APPS</text>
      <text class="num ink" x="780" y="6" text-anchor="end" font-size="22">
        22%
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
      </text>
      <rect class="track" x="0" y="14" width="780" height="14" rx="7"/>
      <rect x="0" y="14" width="0" height="14" rx="7" fill="#F7BF33">
        <animate attributeName="width" from="0" to="172" dur="1s" begin="0.7s" fill="freeze"/>
      </rect>
    </g>

    <!-- Game — Red -->
    <g transform="translate(0 96)">
      <text class="legend" x="0" y="0">03 / GAME STUDIOS</text>
      <text class="num ink" x="780" y="6" text-anchor="end" font-size="22">
        18%
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
      </text>
      <rect class="track" x="0" y="14" width="780" height="14" rx="7"/>
      <rect x="0" y="14" width="0" height="14" rx="7" fill="#F94141">
        <animate attributeName="width" from="0" to="140" dur="1s" begin="0.9s" fill="freeze"/>
      </rect>
    </g>

    <!-- XR — Green -->
    <g transform="translate(0 144)">
      <text class="legend" x="0" y="0">04 / XR · VR · AR</text>
      <text class="num ink" x="780" y="6" text-anchor="end" font-size="22">
        14%
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
      </text>
      <rect class="track" x="0" y="14" width="780" height="14" rx="7"/>
      <rect x="0" y="14" width="0" height="14" rx="7" fill="#0F8657">
        <animate attributeName="width" from="0" to="109" dur="1s" begin="1.1s" fill="freeze"/>
      </rect>
    </g>

    <!-- UX — Blue -->
    <g transform="translate(0 192)">
      <text class="legend" x="0" y="0">05 / UX &amp; HCI RESEARCH</text>
      <text class="num ink" x="780" y="6" text-anchor="end" font-size="22">
        8%
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
      </text>
      <rect class="track" x="0" y="14" width="780" height="14" rx="7"/>
      <rect x="0" y="14" width="0" height="14" rx="7" fill="#3A6DC5" opacity="0.6">
        <animate attributeName="width" from="0" to="62" dur="1s" begin="1.3s" fill="freeze"/>
      </rect>
    </g>

  </g>

  <!-- Bottom legend ticks -->
  <g transform="translate(400 326)">
    <line class="axis" x1="0" y1="0" x2="780" y2="0"/>
    <line class="axis" x1="0" y1="-4" x2="0" y2="4"/>
    <line class="axis" x1="195" y1="-4" x2="195" y2="4"/>
    <line class="axis" x1="390" y1="-4" x2="390" y2="4"/>
    <line class="axis" x1="585" y1="-4" x2="585" y2="4"/>
    <line class="axis" x1="780" y1="-4" x2="780" y2="4"/>
    <text class="legend" x="0"   y="20">0%</text>
    <text class="legend" x="195" y="20" text-anchor="middle">25%</text>
    <text class="legend" x="390" y="20" text-anchor="middle">50%</text>
    <text class="legend" x="585" y="20" text-anchor="middle">75%</text>
    <text class="legend" x="780" y="20" text-anchor="end">100%</text>
  </g>
</svg>
