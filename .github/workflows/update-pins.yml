name: Update pinned repo cards

on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SVG pin cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python profile/scripts/generate-pins.py

      - name: Commit if changed
        run: |
          git config user.name  "mgm-laboratory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profile/pins/*.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(pins): refresh featured repo cards"
            git push
          fi
